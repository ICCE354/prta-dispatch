<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PRTA MDT</title>

<style>
body{font-family:Arial;margin:0;background:#9fd3ff}
.page{display:none;padding:20px}

button{
padding:10px;
margin:5px;
background:#1e88e5;
color:white;
border:none;
cursor:pointer
}

input{padding:8px;margin:5px}

table{
width:100%;
border-collapse:collapse
}

td,th{
border:1px solid black;
padding:6px;
text-align:center
}

/* SYSTEM BAR */
#systemBar{
position:fixed;
bottom:0;
width:100%;
background:#0f7a3c;
color:white;
padding:12px;
font-weight:bold
}

.late{background:#1e3a8a}
.early{background:#b91c1c}
</style>
</head>

<body>

<div id="login" class="page" style="display:block">
<h2>Login</h2>
<input id="user" placeholder="Username"><br>
<input id="pass" placeholder="Password"><br>
<button onclick="login()">Login</button>
</div>

<!-- DRIVER -->
<div id="driver" class="page">
<h2>Driver MDT</h2>
<button onclick="logout()">Logout</button>

<h3>Schedule</h3>
<table id="driverTable"></table>

<h3>Canned Messages</h3>
<button onclick="sendDriverMsg('Running Late')">Running Late</button>
<button onclick="sendDriverMsg('Traffic Delay')">Traffic Delay</button>
<button onclick="sendDriverMsg('Mechanical Issue')">Mechanical Issue</button>
<button onclick="sendDriverMsg('Customer Declined Shoulder Strap')">
Customer Declined Shoulder Strap</button>

<h3>Messages from Dispatch</h3>
<div id="driverMsgs"></div>
</div>

<!-- DISPATCH -->
<div id="dispatch" class="page">
<h2>Dispatcher</h2>
<button onclick="logout()">Logout</button>

<h3>Create Schedule</h3>
<input id="dDriver" placeholder="Driver"><br>

<div id="timepoints"></div>

<button onclick="addStop()">Add Timepoint</button>
<button onclick="assign()">Assign Schedule</button>

<h3>Send Message</h3>
<input id="msgDriver" placeholder="Driver">
<input id="msgText" placeholder="Message">
<button onclick="sendDispatchMsg()">Send</button>

<h3>Driver Messages</h3>
<div id="dispatchMsgs"></div>
</div>

<div id="systemBar">SYSTEMS OK</div>

<script>

const users={
"3675":{p:"SR",r:"driver"},
"3804":{p:"ER",r:"driver"},
"dispatcher":{p:"admin",r:"dispatch"}
}

let current=null

let schedules=JSON.parse(localStorage.getItem("schedules")||"{}")
let messages=JSON.parse(localStorage.getItem("messages")||"{}")

/* LOGIN */
function login(){

let u=user.value
let p=pass.value

if(!users[u]||users[u].p!==p){
alert("bad login")
return
}

current=u

document.querySelectorAll(".page").forEach(p=>p.style.display="none")

if(users[u].r==="driver"){
driver.style.display="block"
loadDriver()
}

if(users[u].r==="dispatch"){
dispatch.style.display="block"
renderDispatchMsgs()
}

}

/* LOGOUT */
function logout(){
location.reload()
}

/* ADD STOP */
function addStop(){

let div=document.createElement("div")

div.innerHTML=`
<input placeholder="Stop Name">
<input placeholder="HH:MM">
`

timepoints.appendChild(div)

}

/* ASSIGN */
function assign(){

let d=dDriver.value

let rows=document.querySelectorAll("#timepoints div")

let list=[]

rows.forEach(r=>{
let inputs=r.querySelectorAll("input")

let name=inputs[0].value
let time=inputs[1].value

if(name && time){
list.push({
name,
time,
arrived:false
})
}
})

schedules[d]=list

localStorage.setItem("schedules",JSON.stringify(schedules))

alert("Schedule Assigned")

}

/* DRIVER VIEW */
function loadDriver(){

let list=schedules[current]||[]

driverTable.innerHTML="<tr><th>Stop</th><th>Time</th><th>Status</th></tr>"

list.forEach((s,i)=>{

let row=driverTable.insertRow()

row.insertCell().innerText=s.name
row.insertCell().innerText=s.time

let c=row.insertCell()

if(!s.arrived){
c.innerHTML=`<button onclick="arrive(${i})">ARRIVED</button>`
}else{
c.innerText=s.status
}

})

renderDriverMsgs()

}

/* ARRIVE */
function arrive(i){

let s=schedules[current][i]

let [h,m]=s.time.split(":").map(Number)

let sched=new Date()
sched.setHours(h,m,0,0)

let diff=Math.round((new Date()-sched)/60000)

s.arrived=true

if(diff>=2){
s.status="LATE "+diff+" MIN"
systemBar.className="late"
systemBar.innerText=s.status
}

else if(diff<=-2){
s.status="EARLY "+Math.abs(diff)+" MIN"
systemBar.className="early"
systemBar.innerText=s.status
}

else{
s.status="ON TIME"
systemBar.className=""
systemBar.innerText="SYSTEMS OK"
}

if(schedules[current].every(x=>x.arrived)){
delete schedules[current]
}

localStorage.setItem("schedules",JSON.stringify(schedules))

loadDriver()

}

/* DRIVER → DISPATCH */
function sendDriverMsg(text){

if(!messages.dispatch)messages.dispatch=[]

messages.dispatch.push({
from:current,
text
})

localStorage.setItem("messages",JSON.stringify(messages))

alert("Message Sent")

renderDispatchMsgs()

}

/* DISPATCH → DRIVER */
function sendDispatchMsg(){

let d=msgDriver.value

if(!messages[d])messages[d]=[]

messages[d].push({
text:msgText.value
})

localStorage.setItem("messages",JSON.stringify(messages))

renderDriverMsgs()

}

/* DRIVER MSG VIEW */
function renderDriverMsgs(){

driverMsgs.innerHTML=""

(messages[current]||[]).forEach(m=>{
driverMsgs.innerHTML+=m.text+"<br>"
})

}

/* DISPATCH MSG VIEW */
function renderDispatchMsgs(){

dispatchMsgs.innerHTML=""

(messages.dispatch||[]).forEach(m=>{
dispatchMsgs.innerHTML+=m.from+": "+m.text+"<br>"
})

}

</script>

</body>
</html>
